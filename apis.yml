aid: valence-fka-shift
name: Valence (FKA Shift)
description: >-
  Valence (formerly Shift) is an enterprise AI coaching platform backed by
  Insight Partners. Its flagship product, Nadia, is an AI leadership coach
  that helps managers and their teams adopt AI, build skills, and improve
  teamwork, alongside team tools Align, Habit, Perspective, Reflect 360, and
  Connect. The platform is enterprise SaaS with SAML SSO and SCIM
  provisioning, certified SOC 2 Type 2, ISO 27001, and ISO 42001, and
  publishes no public developer API.
